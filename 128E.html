<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>128E</title>
    <style>
        .blank {
            background-color: white;
            padding-top: 50px;
            border: .15rem solid
        }

        .highlighted {
            background-color: yellow;
            padding-top: 50px;
            border: .15rem solid
        }

        .app {
            display: grid;
            grid-template-columns: repeat(2, 70px);
            grid-template-rows: repeat(2, 70px)
        }

        .results {
            padding: auto;
            width: 50px;
            border: 1px solid;
            background-color: rgb(215, 215, 215);
        }
    </style>
</head>

<body>

    <div id="app"></div>
    <script>
        let startTime = 0;
        const blank = `<div class="blank"></div>`;
        const highlighted = `<div class="highlighted" onclick="calculateReactionTime()"></div>`;
        let actionTime = "";
        //main array that will not be changed directly
        const squares = [blank, blank, blank, blank];



        updateView()
        function updateView() {
            document.getElementById("app").innerHTML = /*HTML*/`
            <div class="app">
                ${returnSquare(Math.floor(Math.random() * 4))}
            </div>

            <div id="resultsBoard" class="results">Results<br>${actionTime}</div>
            `
            startTimer();
        }

        function returnSquare(number) {
            //makes a copy of the data from main array that will be changed
            let newSquares = squares.slice();
            //uses number to target an index in array and swap it with the "highlighted" variable
            newSquares[number] = highlighted;
            //combines all array items into one string, this prevents the commas from appearing inside the template literal
            return newSquares.join("");
        }


        function calculateReactionTime() {
            let timeOfClick = new Date().getTime();
            let reactionTime = (timeOfClick - startTime) / 1000;
            updateResults(reactionTime);
            updateView();
        };

        function updateResults(result) {
            actionTime += `${result}<br>`;
        };

        function startTimer() {
            startTime = new Date().getTime();
        };
    </script>

</body>

</html>
